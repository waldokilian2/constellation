name: "Issue Area Labeler"

# Reads the "Area label" dropdown from an issue form body and applies the
# matching area/* label. actions/labeler can't read issue bodies, so this is a
# small github-script workflow that parses the rendered field.
#
# Issue forms render a field "Area label" as:   ### Area label\n\n<value>
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const m = body.match(/###\s*Area label\s*\n\s*([^\n\r]+)/i);
            const label = m ? m[1].trim() : '';
            const valid = ['area/engine', 'area/server', 'area/web', 'area/mcp', 'area/ci', 'area/infra'];
            if (!label) {
              core.info('No "Area label" section found (likely a bug or task-brief issue) — skipping.');
              return;
            }
            if (!valid.includes(label)) {
              core.warning(`Unrecognized area label "${label}" — not applying.`);
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label],
            });
            core.info(`Applied "${label}" to issue #${context.issue.number}`);
