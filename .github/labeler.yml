# Pull-request path-based labeler config for actions/labeler@v5.
# Adds area/* labels to PRs based on which files they touch.
# Paired with .github/workflows/labeler.yml.
#
# Note: this labels PULL REQUESTS only, by changed paths.
# The "Area label" dropdown on issue forms is handled separately by
# .github/workflows/issue-area-labeler.yml — actions/labeler cannot read
# issue bodies.

area/engine:
- changed-files:
  - any-glob-to-any-file:
    - engine/**
    - tests/**

area/server:
- changed-files:
  - any-glob-to-any-file:
    - server.py

area/web:
- changed-files:
  - any-glob-to-any-file:
    - web/**
    - vite.config.js
    - package.json
    - package-lock.json

area/mcp:
- changed-files:
  - any-glob-to-any-file:
    - engine/mcp_server.py

area/ci:
- changed-files:
  - any-glob-to-any-file:
    - .github/workflows/**
    - .github/ISSUE_TEMPLATE/**
    - .github/labeler.yml
    - .constellation/**

area/infra:
- changed-files:
  - any-glob-to-any-file:
    - Dockerfile
    - docker-compose*.yml
    - docker-compose*.yaml
    - docker-entrypoint.sh
    - .dockerignore
    - requirements.txt
    - start.sh
    - start.bat
