name: "PR Labeler"

# Path-based area/* labels on pull requests via actions/labeler@v5.
# Config: .github/labeler.yml  (sync-labels removes labels when paths no longer match)
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
