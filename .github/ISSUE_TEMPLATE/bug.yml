name: "🐞 Bug report"
description: "Report something that's broken or incorrect"
title: "bug: <short summary>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! The core engine is deterministic — if you see a
        wrong or missing relationship in the graph, that's a parsing/resolution bug,
        not an AI issue. Include a minimal repro (a source snippet is ideal).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What you expected, versus what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, or a snippet of Java/source that triggers it. Attach the source if you can.
      placeholder: |
        1. Analyzed repo with: python -m engine.constellation <repos> --output output/graph.json
        2. Viewed entry point '<repo>:<Class>.<method>'
        3. Saw '<unexpected result>'
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: If this is a graph-resolution bug, which confidence tag is wrong?
      options:
        - EXTRACTED should not have resolved (false positive)
        - INFERRED edge is wrong or missing
        - AMBIGUOUS resolved to the wrong target
        - TRUNCATED unexpectedly
        - N/A — not a resolution bug
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant console output, error messages, or the relevant slice of graph.json.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      description: e.g. "Python 3.12, Windows 11, running via start.sh / Docker image"
    validations:
      required: true
