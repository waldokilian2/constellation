name: "✨ Feature / Enhancement"
description: "Propose a new feature or enhancement for Constellation"
title: "feat: <short summary>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an enhancement! Constellation's core analysis is
        **deterministic (no LLM)** — AI is an advisory layer only. See `AGENTS.md`
        for conventions: pure graph tools, no extra runtime deps, no build step.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One paragraph — what does this add or change?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Problem
      description: What can't users do today? Why does it matter?
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Primary layer
      description: Which part of the system does this touch?
      options:
        - Deterministic engine (no LLM)
        - AI / advisory layer
        - Web UI
        - REST API
        - MCP server
        - Infra / packaging / CI
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area label
      description: For triage. (GitHub does not auto-apply labels from dropdown values — a maintainer adds it, or see the labeler follow-up in the PR.)
      options:
        - area/engine
        - area/server
        - area/web
        - area/mcp
        - area/ci
        - area/infra
  - type: textarea
    id: how
    attributes:
      label: How it would work
      description: Proposed approach, data flow, and key integration points. Reference real files/symbols where possible.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One checkbox per line. If this adds graph tools, note registration in TOOL_DEFINITIONS / execute_tool / routes.
      value: "- [ ] "
  - type: textarea
    id: anchors
    attributes:
      label: Suggested anchors
      description: Files / symbols this touches (e.g. `engine/graph_tools.py`, `models.py`).
  - type: textarea
    id: anti
    attributes:
      label: Anti-goals / non-goals
      description: What is explicitly out of scope, or would violate project principles (e.g. "no LLM in core", "no new runtime deps", "no build step").
  - type: textarea
    id: related
    attributes:
      label: Related issues / PRs
      description: Cross-link with `#NN`.
